name: Deploy theme showcase

on:
    push:
        branches:
            - main
        paths:
            - "index.html"
            - "preview.html"
            - "preview-nav.css"
            - "site.css"
            - "site.js"
            - "assets/**"
            - "LICENSE.md"
            - "CNAME"
            - "*.nnwtheme/**"
            - "test/*.html"
            - "scripts/template-scripts/**"
            - ".github/workflows/pages.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Configure Pages
              uses: actions/configure-pages@v6
            - name: Build site
              run: |
                  mkdir -p _site
                  cp CNAME index.html preview.html preview-nav.css site.css site.js LICENSE.md _site/
                  cp -R assets _site/assets
                  cp -R test _site/test
                  mkdir -p _site/scripts/template-scripts
                  cp scripts/template-scripts/linker.js scripts/template-scripts/youtube-link-rewrite.js _site/scripts/template-scripts/
                  for theme in *.nnwtheme; do
                      mkdir -p "_site/$theme"
                      cp "$theme/stylesheet.css" "_site/$theme/"
                      for font in "$theme"/*.woff; do
                          if [ -f "$font" ]; then
                              cp "$font" "_site/$theme/"
                          fi
                      done
                  done
                  touch _site/.nojekyll
            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: _site
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
